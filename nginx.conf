worker_processes auto;
events {
    worker_connections 10240;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # High Concurrency & Fast Performance Settings
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression for 10x Faster Page Loads
    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rate Limiting against DDoS attacks
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;

    # Upstream Node.js Backend Cluster
    upstream backend_cluster {
        server 127.0.0.1:5000 max_fails=3 fail_timeout=30s;
        keepalive 64;
    }

    server {
        listen 80;
        server_name seakart.com www.seakart.com;

        # Frontend Website
        location / {
            root /var/www/sea-kart/dist;
            try_files $uri $uri/ /index.html;
        }

        # Admin Dashboard
        location /admin {
            alias /var/www/seakart-admin/dist;
            try_files $uri $uri/ /admin/index.html;
        }

        # Backend API Reverse Proxy
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
